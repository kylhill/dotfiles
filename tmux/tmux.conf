#### General tmux config

# Use 256 color tmux if terminal supports it
if-shell 'test $(tput colors) -ge 256' 'set-option -g default-terminal "tmux-256color"'
#if-shell 'test $(tput colors) -ge 256' 'set-option -g default-terminal "screen-256color"'
if-shell 'test $(tput colors) -ge 256' 'set-option -ga terminal-overrides ",*-256color:Tc"'
if-shell 'test $(tput colors) -lt 256' 'set-option -g default-terminal "tmux"'
#if-shell 'test $(tput colors) -lt 256' 'set-option -g default-terminal "screen"'

# Make Ctrl+Left and Ctrl+Right work properly
set -ga terminal-overrides "xterm*:kLFT5=\eOD:kRIT5=\eOC:kUP5=\eOA:kDN5=\eOB:smkx@:rmkx@"

# Update terminal window title dynamically
set-option -g set-titles on
set-option -g set-titles-string '#(whoami)@#(hostname -f)'

# Start window numbers at 1 to match keyboard order with tmux window order
set-option -g base-index 1
set-window-option -g pane-base-index 1

# Renumber windows sequentially after closing any of them
set-option -g renumber-windows on

# Show pane info for a reasonable amount of time
set-option -g display-panes-time 750

# Use the 12h clock
set-option -g clock-mode-style 12

# Fix funky characters at startup on Windows - https://github.com/tmux-plugins/tmux-sensible/issues/61
set-option -g escape-time 50

# Focus events enabled for terminals that support them
set -g focus-events on

# Automatically rename windows based on what's running
set -g automatic-rename on

set-option -g default-command "${SHELL}"
set-option -g history-limit 100000

#### Keybindings

set -g prefix C-a
unbind C-b

bind Tab select-pane -t :.+
bind BTab select-pane -t :.-
bind Space next-window
bind BSpace previous-window

bind C-a last-window
bind a last-window

bind C-Space next-window
bind C-c new-window -c "#{pane_current_path}"
bind C-n next-window
bind C-p previous-window

# Open new panes and splits in the same working directory.
bind c new-window -c "#{pane_current_path}"
bind | split-window -h -c "#{pane_current_path}"
bind % split-window -v -c "#{pane_current_path}"

# Move around panes with j and k, a bit like vim
bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R

# Move between windows with Ctrl-h and Ctrl-l
bind-key -r C-h select-window -t :-
bind-key -r C-l select-window -t :+

# Resize pane shortcuts
bind -r H resize-pane -L 10
bind -r J resize-pane -D 10
bind -r K resize-pane -U 10
bind -r L resize-pane -R 10

# Reload tmux's configuration file.
bind r source-file ~/.tmux.conf \; display "tmux has been reloaded!"

# Smart pane switching with awareness of Vim splits.
# See: https://github.com/christoomey/vim-tmux-navigator
is_vim="ps -o state= -o comm= -t '#{pane_tty}' \
    | grep -iqE '^[^TXZ ]+ +(\\S+\\/)?g?(view|n?vim?x?)(diff)?$'"
bind-key -n 'C-h' if-shell "$is_vim" 'send-keys C-h'  'select-pane -L'
bind-key -n 'C-j' if-shell "$is_vim" 'send-keys C-j'  'select-pane -D'
bind-key -n 'C-k' if-shell "$is_vim" 'send-keys C-k'  'select-pane -U'
bind-key -n 'C-l' if-shell "$is_vim" 'send-keys C-l'  'select-pane -R'
tmux_version='$(tmux -V | sed -En "s/^tmux ([0-9]+(.[0-9]+)?).*/\1/p")'
if-shell -b '[ "$(echo "$tmux_version < 3.0" | bc)" = 1 ]' \
    "bind-key -n 'C-\\' if-shell \"$is_vim\" 'send-keys C-\\'  'select-pane -l'"
if-shell -b '[ "$(echo "$tmux_version >= 3.0" | bc)" = 1 ]' \
    "bind-key -n 'C-\\' if-shell \"$is_vim\" 'send-keys C-\\\\'  'select-pane -l'"

bind-key -T copy-mode-vi 'C-h' select-pane -L
bind-key -T copy-mode-vi 'C-j' select-pane -D
bind-key -T copy-mode-vi 'C-k' select-pane -U
bind-key -T copy-mode-vi 'C-l' select-pane -R
bind-key -T copy-mode-vi 'C-\' select-pane -l

#### Color scheme

# status
set-option -g status-style bg=default,fg=default

# panes
set-option -g display-panes-active-colour yellow
set-option -g pane-border-style fg=blue,bg=default
set-option -g pane-active-border-style fg=yellow,bg=default

# windows
#set-window-option -g window-style fg=default,bg=black
set-window-option -g window-status-current-style fg=white,bg=yellow
set-window-option -g window-status-style fg=brightcyan,bg=default

# messages
set-option -g message-style fg=white,bg=yellow

#### Status

set-option -g status-left ""
