#### General tmux config

# Fix funky characters at startup on Windows - https://github.com/tmux-plugins/tmux-sensible/issues/61
set-option -sg escape-time 50

# Start a non-login shell by default
set-option -g default-command "${SHELL}"

# Set terminfo, use 24-bit color
set-option -s default-terminal "tmux"
if-shell 'test $(tput colors) -ge 256' 'set-option -s default-terminal "tmux-256color"'
if-shell 'test $(tput colors) -ge 256' 'set-option -as terminal-overrides ",*-256color:RGB"'

# Update terminal window title dynamically
set-option -g set-titles on
set-option -g set-titles-string "#{user}@#h: #W"

# Start window numbers at 1 to match keyboard order with tmux window order
set-option -g base-index 1
set-window-option -g pane-base-index 1

# Automatically rename windows based on what's running
set-option -g automatic-rename on

# Renumber windows sequentially after closing any of them
set-option -g renumber-windows on

# Show pane info for a reasonable amount of time
set-option -g display-panes-time 750

# Show status info for a reasonable amount of time
set-option -g display-time 750

# Use the 12h clock
set-option -g clock-mode-style 12

#### Keybindings

set-option -g prefix C-a

bind-key Tab select-pane -t :.+
bind-key BTab select-pane -t :.-
bind-key Space next-window
bind-key BSpace previous-window
bind-key C-a last-window

# Open new windows in the same working directory.
bind-key c new-window -c "#{pane_current_path}"
bind-key C-c new-window -c "#{pane_current_path}"

# Open panes in the same working directory
bind-key "|" split-window -h -c "#{pane_current_path}"
bind-key "\\" split-window -fh -c "#{pane_current_path}"
bind-key "-" split-window -v -c "#{pane_current_path}"
bind-key "_" split-window -fv -c "#{pane_current_path}"
bind-key "%" split-window -v -c "#{pane_current_path}"
bind-key '"' split-window -v -c "#{pane_current_path}"

# Move around panes with j and k, a bit like vim
bind-key h   select-pane -L
bind-key C-h select-pane -L
bind-key j   select-pane -D
bind-key C-j select-pane -D
bind-key k   select-pane -U
bind-key C-k select-pane -U
bind-key l   select-pane -R
bind-key C-l select-pane -R

# Move between windows with Ctrl-h and Ctrl-l
bind-key -r C-h select-window -t :-
bind-key -r C-l select-window -t :+

# Swap windows with "<" and ">"
bind-key -r "<" swap-window -d -t -1
bind-key -r ">" swap-window -d -t +1

# Resize pane shortcuts
bind-key -r H resize-pane -L 10
bind-key -r J resize-pane -D 10
bind-key -r K resize-pane -U 10
bind-key -r L resize-pane -R 10

#### Color scheme

# status
set-option -g status-style bg=default,fg=default

# panes
set-option -g display-panes-active-colour yellow
set-option -g pane-border-style fg=blue,bg=default
set-option -g pane-active-border-style fg=yellow,bg=default

# windows
set-window-option -g window-status-current-style fg=white,bg=yellow
set-window-option -g window-status-style fg=brightcyan,bg=default

# messages
set-option -g message-style fg=white,bg=yellow

#### Status

#set-option -g status-interval 2
set-option -g status-left ''
set-option -g status-right '#{cpu_fg_color}CPU #{cpu_percentage} | #{ram_fg_color}MEM #{ram_percentage} | #[fg=default]#{df_avail_private1} #{df_percent_private1}'
set-option -g @df_cmd_private1 "/srv"

#### Plugins

set -g @plugin 'tmux-plugins/tmux-sensible'
set -g @plugin 'christoomey/vim-tmux-navigator'
set -g @plugin 'tmux-plugins/tmux-cpu'
set -g @plugin 'tassaron/tmux-df'

# Initialize TMUX plugin manager (keep this line at the very bottom of tmux.conf)
run '/usr/share/tmux-plugin-manager/tpm'
