#### General tmux config

# Fix funky characters at startup on Windows - https://github.com/tmux-plugins/tmux-sensible/issues/61
set-option -sg escape-time 50

# Automatically copy SSH_AUTH_SOCK from login shell to tmux environment
set-option -sg update-environment "SSH_AUTH_SOCK"

# Enable clipboard access from within tmux
set-option -sg set-clipboard on

# Set terminfo, use 24-bit color if possible
if-shell 'test $(tput colors) -lt 256' {
    set-option -s default-terminal "tmux"
} {
    set-option -s default-terminal "tmux-256color"
    set-option -as terminal-overrides ",*-256color:RGB"
}

# Update terminal window title dynamically
set-option -g set-titles on
set-option -g set-titles-string "#{user}@#h: #W"

# Start window numbers at 1 to match keyboard order with tmux window order
set-option -g base-index 1
set-window-option -g pane-base-index 1

# Automatically rename windows based on what's running
set-option -g automatic-rename on

# Renumber windows sequentially after closing any of them
set-option -g renumber-windows on

# Use the 12h clock
set-option -g clock-mode-style 12

#### Keybindings

set-option -g prefix C-a
bind-key Tab select-pane -t :.+
bind-key BTab select-pane -t :.-
bind-key -r C-h select-window -t :-
bind-key -r C-l select-window -t :+
bind-key C-a last-window

# Open new windows in the same working directory.
bind-key c new-window -c "#{pane_current_path}"
bind-key C-c new-window -c "#{pane_current_path}"

# Open panes in the same working directory
bind-key "|" split-window -h -c "#{pane_current_path}"
bind-key "\\" split-window -fh -c "#{pane_current_path}"
bind-key "-" split-window -v -c "#{pane_current_path}"
bind-key "_" split-window -fv -c "#{pane_current_path}"
bind-key "%" split-window -v -c "#{pane_current_path}"
bind-key '"' split-window -v -c "#{pane_current_path}"

# Swap windows with "<" and ">"
bind-key -r "<" swap-window -d -t -1
bind-key -r ">" swap-window -d -t +1

# Resize pane shortcuts
bind-key -r H resize-pane -L 10
bind-key -r J resize-pane -D 10
bind-key -r K resize-pane -U 10
bind-key -r L resize-pane -R 10

# Dracula
set -g @dracula-plugins "cpu-usage ram-usage"
set -g @dracula-cpu-usage-colors "light_purple dark_gray"
set -g @dracula-ram-usage-colors "green dark_gray"
set -g @dracula-show-flags false
set -g @dracula-left-pad ' '
set -g @dracula-right-pad '​'
set -g @dracula-show-powerline true
set -g @dracula-transparent-powerline-bg false
set -g @dracula-inverse-divider '​'
set -g @dracula-show-left-icon '​'
#set -g @dracula-show-left-icon "#h"
set -g @dracula-left-icon-padding 0
set -g @dracula-border-contrast true
set -g @dracula-cpu-display-load false
set -g @dracula-cpu-usage-label ""
set -g @dracula-ram-usage-label ""

# Solarized Dark Adapted Palette
set -g @dracula-colors "
white='#93a1a1'        # base1 — soft light text
gray='#586e75'         # base01 — normal text / muted
dark_gray='#002b36'    # base03 — background
light_purple='#268bd2' # blue accent
dark_purple='#073642'  # base02 — panel contrast
cyan='#2aa198'         # cyan accent
green='#859900'        # green accent
orange='#cb4b16'       # orange accent
red='#dc322f'          # red accent
pink='#d33682'         # magenta accent
#yellow='#b58900'       # yellow accent
yellow='#cb4b16'       # orange accent
"

# Plugins
set -g @plugin 'tmux-plugins/tmux-sensible'
set -g @plugin 'christoomey/vim-tmux-navigator'
set -g @plugin 'dracula/tmux'

# Initialize TMUX plugin manager (keep this line at the very bottom of tmux.conf)
run '/usr/share/tmux-plugin-manager/tpm'
