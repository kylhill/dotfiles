services:
  kanzi:
    image: lscr.io/linuxserver/kanzi:latest
    container_name: kanzi
    environment:
      - PUID=119
      - PGID=123
      - TZ=America/Chicago
      - INVOCATION_NAME=kodi
      - URL_ENDPOINT=https://kanzi.tacomafia.net
    volumes:
      - /opt/appdata/kanzi:/config
    restart: unless-stopped
  flexget:
    image: ghcr.io/wiserain/flexget:latest
    container_name: flexget
    environment:
      - PUID=114
      - PGID=124
      - TZ=America/Chicago
    volumes:
      - /opt/appdata/flexget:/config
      - /srv/shared/video/Series:/srv/shared/video/Series:ro
    restart: unless-stopped
  freshrss:
    image: lscr.io/linuxserver/freshrss:latest
    container_name: freshrss
    depends_on:
      - mariadb
      - fulltextrss
    environment:
      - PUID=120
      - PGID=125
      - TZ=America/Chicago
    volumes:
      - /opt/appdata/freshrss:/config
    restart: unless-stopped
  deluge:
    image: lscr.io/linuxserver/deluge:latest
    container_name: deluge
    network_mode: "host"
    environment:
      - PUID=1000
      - PGID=100
      - TZ=America/Chicago
      - UMASK=022
    volumes:
      - /opt/appdata/deluge:/config
      - /var/working:/var/working
      - /srv/shared/torrents:/srv/shared/torrents
    restart: unless-stopped
  fulltextrss:
    image: heussd/fivefilters-full-text-rss:latest
    container_name: fulltextrss
    volumes:
      - /var/www/html/cache
      - /opt/appdata/fulltextrss/ftr-site-config:/var/www/html/site_config/standard:ro
      - /opt/appdata/fulltextrss/custom_config.php:/var/www/html/custom_config.php:ro
      - /opt/appdata/fulltextrss/mpm_prefork.conf:/etc/apache2/mods-enabled/mpm_prefork.conf:ro
    restart: unless-stopped
  grocy:
    image: lscr.io/linuxserver/grocy:latest
    container_name: grocy
    environment:
      - PUID=121
      - PGID=126
      - TZ=America/Chicago
    volumes:
      - /opt/appdata/grocy:/config
    restart: unless-stopped
  cloudflare-ddns:
    image: ghcr.io/joshuaavalon/cloudflare-ddns:latest
    container_name: cloudflare-ddns
    network_mode: "host"
    environment:
      - PUID=117
      - PGID=127
      - CRON=0 */6 * * *
    volumes:
      - /opt/appdata/cloudflare-ddns/config.yaml:/app/config.yaml
    restart: unless-stopped
  unifi-controller:
    image: lscr.io/linuxserver/unifi-controller:latest
    container_name: unifi-controller
    environment:
      - PUID=115
      - PGID=121
      - MEM_LIMIT=256
      - MEM_STARTUP=256
    ports:
      - "3478:3478/udp"
      - "10001:10001/udp"
      - "8080:8080"
    volumes:
      - /opt/appdata/unifi-controller:/config
    restart: unless-stopped
  homeassistant:
    image: lscr.io/linuxserver/homeassistant:latest
    container_name: homeassistant
    network_mode: "host"
    environment:
      - PUID=123
      - PGID=128
      - TZ=America/Chicago
    volumes:
      - /opt/appdata/homeassistant:/config
      - /srv/shared:/srv/shared:ro
    restart: unless-stopped
#  esphome:
#    image: ghcr.io/esphome/esphome:latest
#    container_name: esphome
#    network_mode: "host"
#    volumes:
#      - /opt/appdata/esphome:/config
#      - /etc/localtime:/etc/localtime:ro
#    restart: unless-stopped
#  uptime-kuma:
#    image: louislam/uptime-kuma:latest
#    container_name: uptime-kuma
#    depends_on:
#      - nginx
#    volumes:
#      - /opt/appdata/uptime-kuma:/app/data
#    restart: unless-stopped
  mariadb:
    image: lscr.io/linuxserver/mariadb:latest
    container_name: mariadb
    environment:
      - PUID=113
      - PGID=118
      - TZ=America/Chicago
    volumes:
      - /opt/appdata/mariadb:/config
    ports:
      - "3306:3306"
    restart: unless-stopped
  nginx:
    image: ubuntu/nginx:latest
    container_name: nginx
    volumes:
      - /opt/appdata/nginx/etc/nginx.conf:/etc/nginx/nginx.conf:ro
      - /opt/appdata/nginx/etc/sites-enabled:/etc/nginx/sites-enabled:ro
      - /opt/appdata/nginx/etc/snippets:/etc/nginx/snippets:ro
      - /opt/appdata/nginx/etc/conf.d:/etc/nginx/conf.d:ro
      - /opt/appdata/nginx/www:/var/www:ro
      - /etc/letsencrypt:/etc/letsencrypt:ro
      - /srv/backup:/srv/backup:ro
      - /srv/kws:/srv/kws:ro
      - /srv/shared:/srv/shared:ro
    ports:
      - "80:80"
      - "443:443"
    restart: unless-stopped
