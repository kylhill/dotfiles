services:
  kanzi:
    image: lscr.io/linuxserver/kanzi
    container_name: kanzi
    environment:
      - PUID=119
      - PGID=123
      - TZ=America/Chicago
      - INVOCATION_NAME=kodi
      - URL_ENDPOINT=https://kanzi.tacomafia.net
    volumes:
      - /opt/appdata/kanzi:/config
    ports:
      - "127.0.0.1:8000:8000"
    restart: unless-stopped
  flexget:
    image: ghcr.io/wiserain/flexget
    container_name: flexget
    environment:
      - PUID=114
      - PGID=124
      - TZ=America/Chicago
    volumes:
      - /opt/appdata/flexget:/config
      - /srv/shared/video/Series:/srv/shared/video/Series:ro
    restart: unless-stopped
  freshrss:
    image: lscr.io/linuxserver/freshrss
    container_name: freshrss
    environment:
      - PUID=120
      - PGID=125
      - TZ=America/Chicago
    volumes:
      - /opt/appdata/freshrss:/config
    ports:
      - "127.0.0.1:8001:80"
    restart: unless-stopped
  deluge:
    image: lscr.io/linuxserver/deluge
    container_name: deluge
    network_mode: "host"
    environment:
      - PUID=1000
      - PGID=100
      - TZ=America/Chicago
      - UMASK=022
    volumes:
      - /opt/appdata/deluge:/config
      - /var/working:/var/working
      - /srv/shared/torrents:/srv/shared/torrents
    restart: unless-stopped
  fulltextrss:
    image: heussd/fivefilters-full-text-rss
    container_name: fulltextrss
    volumes:
      - /var/www/html/cache
      - /opt/appdata/fulltextrss/ftr-site-config:/var/www/html/site_config/standard:ro
      - /opt/appdata/fulltextrss/custom_config.php:/var/www/html/custom_config.php:ro
      - /opt/appdata/fulltextrss/mpm_prefork.conf:/etc/apache2/mods-enabled/mpm_prefork.conf:ro
    ports:
      - "127.0.0.1:8002:80"
    restart: unless-stopped
  grocy:
    image: lscr.io/linuxserver/grocy
    container_name: grocy
    environment:
      - PUID=121
      - PGID=126
      - TZ=America/Chicago
    volumes:
      - /opt/appdata/grocy:/config
    ports:
      - "127.0.0.1:8003:80"
    restart: unless-stopped
  doh-server:
    image: satishweb/doh-server
    container_name: doh-server
    environment:
      - DEBUG=0
      - UPSTREAM_DNS_SERVER=udp:192.168.1.1:53
      - DOH_HTTP_PREFIX=/dns-query
      - DOH_SERVER_LISTEN=:8053
    ports:
      - "127.0.0.1:8053:8053"
    restart: unless-stopped
  cloudflare-ddns:
    image: ghcr.io/joshuaavalon/cloudflare-ddns
    container_name: cloudflare-ddns
    network_mode: "host"
    environment:
      - PUID=117
      - PGID=127
      - CRON=*/60 * * * *
    volumes:
      - /opt/appdata/cloudflare-ddns/config.yaml:/app/config.yaml
    restart: unless-stopped
  unifi-controller:
    image: lscr.io/linuxserver/unifi-controller
    container_name: unifi-controller
    environment:
      - PUID=115
      - PGID=121
      - MEM_LIMIT=512M
      - MEM_STARTUP=512M
    ports:
      - "3478:3478/udp"
      - "10001:10001/udp"
      - "8080:8080"
      - "8004:8443"
    volumes:
      - /opt/appdata/unifi-controller:/config
    restart: unless-stopped
  homeassistant:
    image: lscr.io/linuxserver/homeassistant
    container_name: homeassistant
    network_mode: "host"
    environment:
      - PUID=123
      - PGID=128
      - TZ=America/Chicago
    volumes:
      - /opt/appdata/homeassistant:/config
      - /srv/shared:/srv/shared:ro
    restart: unless-stopped
  esphome:
    image: ghcr.io/esphome/esphome
    container_name: esphome
    network_mode: "host"
    volumes:
      - /opt/appdata/esphome:/config
      - /etc/localtime:/etc/localtime:ro
    restart: unless-stopped
  minecraft:
    image: itzg/minecraft-bedrock-server
    container_name: minecraft
    environment:
      - EULA=TRUE
      - SERVER_NAME=Dad's Server
      - GAMEMODE=survival
      - DIFFICULTY=normal
      - OPS=2533274795625937,2535405415054487,2535405917118583
      #- ALLOW_LIST_USERS=monkeyman 67156,IsaacChief13,OfficerCarson17
    volumes:
      - /opt/appdata/minecraft:/data
    ports:
      - "19132:19132/udp"
    stdin_open: true
    tty: true
