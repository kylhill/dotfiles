version: "3.9"
services:
  nginx:
    build: ./docker/nginx
    container_name: nginx
    environment:
      - TZ=America/Chicago
    volumes:
      - ./appdata/nginx/etc:/etc/nginx:ro
      - ./appdata/nginx/www:/var/www:ro
      - /etc/letsencrypt:/etc/letsencrypt:ro
      - /srv/backup:/srv/backup:ro
      - /srv/kws:/srv/kws:ro
      - /srv/shared:/srv/shared:ro
    ports:
      - "80:80"
      - "443:443"
    restart: unless-stopped
  mariadb:
    image: lscr.io/linuxserver/mariadb:latest
    container_name: mariadb
    environment:
      - PUID=113
      - PGID=118
      - TZ=America/Chicago
    volumes:
      - ./appdata/mariadb:/config
      - ./appdata/mariadb/mysqld:/var/run/mysqld
    ports:
      - "3306:3306"
    restart: unless-stopped
  kanzi:
    image: lscr.io/linuxserver/kanzi:latest
    container_name: kanzi
    environment:
      - PUID=119
      - PGID=123
      - TZ=America/Chicago
      - INVOCATION_NAME=kodi
      - URL_ENDPOINT=https://kanzi.tacomafia.net
    volumes:
      - ./appdata/kanzi:/config
    restart: unless-stopped
  flexget:
    image: docker.io/wiserain/flexget
    container_name: flexget
    depends_on:
      - deluge
    environment:
      - PUID=114
      - PGID=124
      - TZ=America/Chicago
    volumes:
      - ./appdata/flexget:/config
      - /srv/shared/video/Series:/srv/shared/video/Series:ro
    extra_hosts:
      - "host.docker.internal:172.17.0.1"
    restart: unless-stopped
  freshrss:
    image: lscr.io/linuxserver/freshrss:latest
    container_name: freshrss
    depends_on:
      - mariadb
      - fulltextrss
    environment:
      - PUID=120
      - PGID=125
      - TZ=America/Chicago
    volumes:
      - ./appdata/freshrss:/config
      - ./appdata/mariadb/mysqld:/var/run/mysqld
    restart: unless-stopped
  fulltextrss:
    build: ./docker/fulltextrss
    environment:
      - PUID=129
      - PGID=137
      - TZ=America/Chicago
    container_name: fulltextrss
    volumes:
      - ./appdata/fulltextrss:/config
    restart: unless-stopped
  deluge:
    image: lscr.io/linuxserver/deluge:latest
    container_name: deluge
    network_mode: "host"
    environment:
      - PUID=1000
      - PGID=100
      - TZ=America/Chicago
      - UMASK=022
    volumes:
      - ./appdata/deluge:/config
      - ./working:/data/working
      - /srv/shared/torrents:/srv/shared/torrents
    restart: unless-stopped
  grocy:
    image: lscr.io/linuxserver/grocy:latest
    container_name: grocy
    environment:
      - PUID=121
      - PGID=126
      - TZ=America/Chicago
    volumes:
      - ./appdata/grocy:/config
    restart: unless-stopped
  cloudflare-ddns:
    image: ghcr.io/joshuaavalon/cloudflare-ddns:latest
    container_name: cloudflare-ddns
    network_mode: "host"
    environment:
      - PUID=117
      - PGID=127
      - TZ=America/Chicago
      - CRON=0 */6 * * *
    volumes:
      - ./appdata/cloudflare-ddns/config.yaml:/app/config.yaml:ro
    restart: unless-stopped
  unifi-controller:
    image: lscr.io/linuxserver/unifi-controller:latest
    container_name: unifi-controller
    environment:
      - PUID=115
      - PGID=121
      - TZ=America/Chicago
      - MEM_LIMIT=512
      - MEM_STARTUP=512
    ports:
      - "8443:8443"
      - "3478:3478/udp"
      - "10001:10001/udp"
      - "8080:8080"
    volumes:
      - ./appdata/unifi-controller:/config
    restart: unless-stopped
  homeassistant:
    image: lscr.io/linuxserver/homeassistant:latest
    container_name: homeassistant
    network_mode: "host"
    environment:
      - PUID=123
      - PGID=128
      - TZ=America/Chicago
    volumes:
      - ./appdata/homeassistant:/config
      - /srv/shared:/srv/shared:ro
    restart: unless-stopped
  authelia:
    image: ghcr.io/authelia/authelia:latest
    container_name: authelia
    depends_on:
      - redis
    environment:
      - PUID=125
      - PGID=132
      - TZ=America/Chicago
    volumes:
      - ./appdata/authelia:/config
    restart: unless-stopped
  esphome:
    image: ghcr.io/esphome/esphome:latest
    container_name: esphome
    network_mode: "host"
    volumes:
      - ./appdata/esphome:/config
      - /etc/localtime:/etc/localtime:ro
    restart: unless-stopped
#  minecraft:
