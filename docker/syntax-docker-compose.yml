#      - OPS=2533274795625937,2535405415054487,2535405917118583
#      #- ALLOW_LIST_USERS=monkeyman 67156,IsaacChief13,OfficerCarson17
#    volumes:
#      - ./appdata/minecraft:/data
#    ports:
#      - "19132:19132/udp"
#    stdin_open: true
#    tty: true
#    restart: unless-stopped
  wallabag:
    image: docker.io/wallabag/wallabag:latest
    container_name: wallabag
    depends_on:
      - mariadb
      - redis
    environment:
      - TZ=America/Chicago
      - POPULATE_DATABASE=false
      - SYMFONY__ENV__DATABASE_DRIVER=pdo_mysql
      - SYMFONY__ENV__DATABASE_HOST=mariadb
      - SYMFONY__ENV__DATABASE_PORT=3306
      - SYMFONY__ENV__DATABASE_SOCKET="/var/run/mysqld/mysqld.sock"
      - SYMFONY__ENV__DATABASE_NAME=wallabag
      - SYMFONY__ENV__DATABASE_USER=wallabag
      - SYMFONY__ENV__DATABASE_PASSWORD=BYCW8Qn4wZAjW2Rz
      - SYMFONY__ENV__DATABASE_CHARSET=utf8mb4
      - SYMFONY__ENV__SECRET=zZvtPgKS92VFxX6FvxP9Vs9RXMyKMq
      - SYMFONY__ENV__DOMAIN_NAME=https://pocket.tacomafia.net
      - SYMFONY__ENV__SERVER_NAME="tacomafia.net"
    volumes:
      - ./appdata/wallabag/images:/var/www/wallabag/web/assets/images
      - ./appdata/mariadb/mysqld:/var/run/mysqld
    restart: unless-stopped
  uptime-kuma:
    image: docker.io/louislam/uptime-kuma:latest
    container_name: uptime-kuma
    environment:
      - PUID=130
      - PGID=138
    volumes:
      - ./appdata/uptime-kuma:/app/data
    restart: unless-stopped
  redis:
    image: docker.io/redis:alpine
    container_name: redis
    environment:
      - TZ=America/Chicago
    volumes:
      - ./appdata/redis:/data
    restart: unless-stopped
  grafana:
    image: docker.io/grafana/grafana-oss:latest
    container_name: grafana
    depends_on:
      - prometheus
    user: "472:0"
    environment:
      - TZ=America/Chicago
    volumes:
      - ./appdata/grafana/data:/var/lib/grafana
      - ./appdata/grafana/config:/etc/grafana
    restart: unless-stopped
  node-exporter:
    image: quay.io/prometheus/node-exporter:latest
    container_name: node-exporter
    network_mode: "host"
    volumes:
      - /proc:/host/proc:ro
      - /sys:/host/sys:ro
      - /:/rootfs:ro
    command:
      - '--path.procfs=/host/proc'
      - '--path.rootfs=/rootfs'
      - '--path.sysfs=/host/sys'
      - '--collector.filesystem.mount-points-exclude=^/(sys|proc|dev|host|etc)($$|/)'
    restart: unless-stopped
  prometheus:
    image: quay.io/prometheus/prometheus:latest
    container_name: prometheus
    depends_on:
      - node-exporter
    user: "126:133"
    volumes:
      - ./appdata/prometheus/config:/etc/prometheus
      - ./appdata/prometheus/data:/prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
    restart: unless-stopped
networks:
  default:
    ipam:
      config:
        - subnet: 172.17.0.0/16
