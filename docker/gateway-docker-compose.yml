services:
  pihole:
    container_name: pihole
    image: pihole/pihole:latest
    network_mode: "host"
    environment:
      TZ: 'America/Chicago'
      ServerIP: '192.168.1.1'
      ServerIPv6: 'fd06:4f9a:934d:1::1'
      VIRTUAL_HOST: 'pihole.tacomafia.net'
      WEB_PORT: '8000'
    volumes:
      - /opt/appdata/pihole/etc/pihole/:/etc/pihole/
      - /opt/appdata/pihole/etc/dnsmasq.d/:/etc/dnsmasq.d/
    cap_add:
      - NET_ADMIN
    restart: unless-stopped
  cloudflare-ddns:
    image: ghcr.io/joshuaavalon/cloudflare-ddns
    container_name: cloudflare-ddns
    network_mode: "host"
    environment:
      PUID: "114"
      PGID: "120"
      CRON: "*/60 * * * *"
    volumes:
      - /opt/appdata/cloudflare-ddns/config.yaml:/app/config.yaml
    restart: unless-stopped
