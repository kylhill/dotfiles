###############################################################################
#
# Kyle's Custom Flexget Configuration
#
# This script checks custom rss feeds and downloads all of the series
# that it matches from it.  It then passes the torrents straight to
# Deluge for downloading.
#
###############################################################################

tasks:
  showrss:
    # showRSS: no magnets (allows rename), no namespaces, cleaned names, per-show settings for quality, and all propers
    rss: https://showrss.info/user/219.rss?magnets=false&namespaces=false&name=clean&quality=null&re=yes

    # Download all series from the custom feed
    all_series: yes
    accept_all: yes

    # Lookup show metadata from TheTVDB
    thetvdb_lookup: yes

    # Make sure all filenames are Windows safe
    pathscrub: windows

    # Don't download if we have less than 10 GB of free space
    free_space:
      path: /srv/shared/torrents/
      space: 10000

    # Output entries to Deluge
    deluge:
      main_file_only: yes
      queuetotop: yes
      maxupspeed: 100.0     # don't attract too much attention

      # Rename files using TheTVDB metadata: "Series Name/Sx0E - Episode Name"
      content_filename: /{{ series_season }}x{{ series_episode|pad(2) }}{% if tvdb_ep_name %} - {{ tvdb_ep_name }}{% endif %}
      movedone: /srv/shared/torrents/{{ tvdb_series_name|default(series_name) }}

