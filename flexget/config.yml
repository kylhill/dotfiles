templates:
  tv:
    # Lookup show metadata from TheTVDB
    thetvdb_lookup: yes

    # Try to parse additional information from file names
    parsing:
      series: guessit

    # Make sure all filenames are Windows safe
    pathscrub: windows

    # Don't download if we have less than 10 GB of free space
    free_space:
      path: /srv/shared/torrents/
      space: 10000

    # Output entities to Deluge
    deluge:
      queue_to_top: yes
      remove_at_ratio: yes

      # Rename files using TheTVDB metadata: "Series Name/Sx0E - Episode Name"
      content_filename: /{{ series_season }}x{{ series_episode|pad(2) }}{% if tvdb_ep_name %} - {{ tvdb_ep_name }}{% endif %}
      move_completed_path: /srv/shared/torrents/{{ tvdb_series_name|default(series_name) }}

tasks:
  tv-private:
    template: tv
    priority: 1

    # Private RSS feed for TV shows from morethan.tv
    rss:
      url: https://www.morethan.tv/feeds.php?feed=torrents_tv&user=29212&auth=56334d999e47d093a963b47ea822356f&passkey=ah6polqnqemxtw50i0ggnivc76e0lbic&authkey=mkhit4lab7s78t1lfu0qghxz1mhy13l7
      all_entries: no

    configure_series:
      from:
        # Download shows from any series that we already have
        filesystem: /srv/shared/video/Series/

      settings:
        # Wait for a 720p hdtv (or better) release for 12 hours, after that download the best episode seen, up to 1080p.
        timeframe: 12 hours
        target: 720p hdtv+
        quality: <=1080p webrip+ h264+

        # Download the target quality if it becomes available after the timeframe
        upgrade: yes

        # Don't download specials
        specials: no

        # Download new season packs as they become available
        #season_packs: always

    # Deluge settings for private torrents
    deluge:
      ratio: 0.10

    # Force strict checking to avoid downloading stuff we don't want
    series:
      - "Law & Order":
          exact: yes
      - "The War":
          exact: yes

