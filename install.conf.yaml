- defaults:
    link:
      create: true
      force: true

- clean: ['~']

- shell:
  - touch ~/.hushlogin
  - git submodule update --init --recursive

- link:
    ~/.config/nvim:
        path: nvim/
    ~/.bashrc:
    ~/.dircolors:
        path: external/dircolors-solarized/dircolors.256dark
    ~/.gitconfig:
    ~/.inputrc:
    ~/.local/bin:
        path: bin/
    ~/.oh-my-bash:
        path: external/oh-my-bash
    ~/.ssh/config:
        path: ssh/config
    ~/.tmux.conf:
    ~/.vimrc:

- create:
    - ~/.cache

- shell:
  - source ~/.bashrc
