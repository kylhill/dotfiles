- defaults:
    link:
      create: true
      force: true

- clean: ['~']

- shell:
  - touch ~/.hushlogin
  - git submodule update --init --recursive

- link:
    ~/.aptitude:
    ~/.bashrc:
    ~/.bash_aliases:
    ~/.dircolors:
        path: dircolors/dircolors-solarized/dircolors.256dark
    ~/.gitconfig:
    ~/.inputrc:
    ~/.vim:
    ~/.vimrc:
    ~/.config/nvim/init.vim:
        path: vim/init.vim
    ~/.config/xfce4/terminal/terminalrc:
        path: xfce4/terminal/terminalrc
    ~/.ssh/config:
        path: ssh/config
    ~/.local/bin:
        path: bin/
    ~/.tmux.conf:

- create:
    - ~/.cache

- shell:
  - source ~/.bashrc
