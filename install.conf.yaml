- defaults:
    link:
      create: true
      force: true

- clean: ['~']

- link:
    ~/.aptitude:
        path: aptitude/
    ~/.bashrc:
        path: bash/bashrc
    ~/.bash_aliases:
        path: bash/bash_aliases
    ~/.bash_profile:
        path: bash/bash_profile
    ~/.byobu/color.tmux:
        path: byobu/color.tmux
    ~/.byobu/status:
        path: byobu/status
    ~/.byobu/statusrc:
        path: byobu/statusrc
    ~/.byobu/.tmux.conf:
        path: byobu/tmux.conf
    ~/.dircolors:
        path: bash/dircolors/dircolors-solarized/dircolors.256dark
    ~/.gitconfig:
        path: git/gitconfig
    ~/.inputrc:
        path: bash/inputrc
    ~/.config/tvnamer/tvnamer.json:
        path: tvnamer/tvnamer.json
    ~/.vim:
        path: vim/vim/
    ~/.vimrc:
        path: vim/vimrc
    ~/.config/nvim/init.vim:
        path: vim/init.vim
    ~/.ssh/config:
        path: ssh/config
    ~/.local/bin:
        path: bin/

- shell:
  - touch ~/.hushlogin
  - [git submodule update --init --recursive, Installing submodules]
