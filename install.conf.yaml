- defaults:
    link:
        create: true
        relink: true

- clean:
    ~/:
        recursive: false
    ~/.config:
        recursive: false
    ~/.local/bin:
        recursive: false
    ~/.ssh/config.d:
        recursive: false

- create:
    ~/.cache:
    ~/.cache/ssh:
        mode: 0700
    ~/.ssh:
        mode: 0700
    ~/.ssh/config.d:
        mode: 0700

- link:
    ~/.config/bash/docker.bash:
        path: bash/docker.bash
    ~/.config/direnv/direnv.toml:
        path: direnv.toml
    ~/.config/starship.toml:
        path: starship.toml
    ~/.config/nvim:
        path: nvim
    ~/.bashrc:
    ~/.dircolors:
        path: external/dircolors-solarized/dircolors.256dark
    ~/.gitconfig:
    ~/.inputrc:
    ~/.ssh/config:
        path: ssh/config
    ~/.ssh/config.d/90-linux.conf:
        path: ssh/config.d/90-linux.conf
    ~/.tmux.conf:
    ~/.vimrc:

- shell:
    - description: Remove legacy Oh My Bash installation
      quiet: true
      command: |
        python3 - <<'PYTHON'
        import shutil
        from pathlib import Path

        legacy = Path.home() / ".oh-my-bash"
        if legacy.is_symlink():
            legacy.unlink()
        elif legacy.is_dir():
            shutil.rmtree(legacy)
        PYTHON

- shell:
    - description: Create hushlogin to suppress login banner
      quiet: true
      command: test -f ~/.hushlogin || touch ~/.hushlogin

- shell:
    - description: Set proper permissions on managed files
      quiet: true
      command: |
        set -e
        chmod 700 ~/.ssh ~/.ssh/config.d ssh ssh/config.d
        chmod 600 ssh/config ssh/config.d/*.conf ~/.ssh/config ~/.ssh/config.d/*.conf
