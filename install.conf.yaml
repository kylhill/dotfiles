- defaults:
    link:
        create: true
        relink: true
        force: true

- clean:
    ~/:
        recursive: false
- create:
    - ~/.cache
    - ~/.ssh

- shell:
    - description: Set proper permissions on SSH directory
      quiet: true
      command: chmod 700 ~/.ssh
    - description: Set proper permissions on cache directory
      quiet: true
      command: chmod 700 ~/.cache
- shell:
    - description: Init submodules
      quiet: true
      command: git submodule update --init --recursive
    - description: Create hushlogin to suppress login banner
      quiet: true
      command: touch ~/.hushlogin
      if: '[ ! -f ~/.hushlogin ]'

- link:
    ~/.config/nvim:
        path: nvim
    ~/.bashrc:
    ~/.dircolors:
        path: external/dircolors-solarized/dircolors.256dark
    ~/.gitconfig:
    ~/.inputrc:
    ~/.local/bin:
        path: bin
    ~/.oh-my-bash:
        path: external/oh-my-bash
    ~/.ssh/config:
        path: ssh/config
        mode: "0600"
    ~/.copilot/copilot-instructions.md:
        path: copilot-instructions.md
    ~/.tmux.conf:
    ~/.vimrc:

- shell:
    - description: Reload bash configuration if interactive
      quiet: true
      command: |
        if [ -n "$BASH_VERSION" ] && [ -t 1 ]; then
          source ~/.bashrc
        fi
