- defaults:
    link:
      create: true
      force: true

- clean: ['~']

- link:
    ~/.aptitude:
        path: aptitude/
    ~/.bashrc:
        path: bash/bashrc
    ~/.byobu:
        path: byobu/
    ~/.dircolors:
        path: bash/dircolors/
    ~/.flexget/config.yml:
        path: flexget/config.yml
    ~/.gitconfig:
        path: git/gitconfig
    ~/.inputrc:
        path: bash/inputrc
    ~/.profile:
        path: bash/profile
    ~/.tvnamer.json:
        path: tvnamer/tvnamer.json
    ~/.vim:
        path: vim/vim/
    ~/.vimrc:
        path: vim/vimrc
    ~/.config/systemd/user/flexget.service:
        path: systemd/user/flexget.service
    ~/.config/systemd/user/flexget.timer:
        path: systemd/user/flexget.timer
    ~/.config/systemd/user/flexget-cleanup.service:
        path: systemd/user/flexget-cleanup.service
    ~/.config/systemd/user/flexget-cleanup.timer:
        path: systemd/user/flexget-cleanup.timer
    ~/.config/systemd/user/rclone.service:
        path: systemd/user/rclone.service
    ~/.config/systemd/user/rclone.timer:
        path: systemd/user/rclone.timer
    ~/.ssh/config:
        path: ssh/config
    ~/.ssh/authorized_keys:
        path: ssh/authorized_keys

- shell:
  - touch ~/.hushlogin
  - [git submodule update --init --recursive, Installing submodules]
