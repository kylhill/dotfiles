- defaults:
    link:
        create: true
        relink: true
        force: true

- clean:
    ~/:
        recursive: false
- create:
    - ~/.cache
    - ~/.cache/ssh
    - ~/.ssh
    - ~/.ssh/config.d

- shell:
    - description: Set proper permissions on directories
      quiet: true
      command: chmod 700 ~/.ssh ~/.ssh/config.d ~/.cache ~/.cache/ssh
- shell:
    - description: Init submodules
      quiet: true
      command: git submodule update --init --recursive
    - description: Create hushlogin to suppress login banner
      quiet: true
      command: touch ~/.hushlogin
      if: '[ ! -f ~/.hushlogin ]'

- link:
    ~/.config/nvim:
        path: nvim
    ~/.bashrc:
    ~/.dircolors:
        path: external/dircolors-solarized/dircolors.256dark
    ~/.gitconfig:
    ~/.inputrc:
    ~/.local/bin:
        path: bin
    ~/.oh-my-bash:
        path: external/oh-my-bash
    ~/.ssh/config:
        path: ssh/config
        mode: "0600"
    ~/.ssh/config.d/90-linux.conf:
        path: ssh/config.d/90-linux.conf
        mode: "0600"
    ~/.copilot/copilot-instructions.md:
        path: copilot-instructions.md
    ~/.tmux.conf:
    ~/.vimrc:

- shell:
    - description: Set proper permissions on managed files
      quiet: true
      command: |
        find . \( -path ./.git -o -path ./external \) -prune -o \( -type d -o -type f \) -exec chmod go-w {} +
        chmod 700 ~/.ssh ~/.ssh/config.d ssh ssh/config.d
        chmod 600 ~/.ssh/config ~/.ssh/config.d/*.conf

- shell:
    - description: Reload bash configuration if interactive
      quiet: true
      command: |
        if [ -n "$BASH_VERSION" ] && [ -t 1 ]; then
          source ~/.bashrc
        fi
