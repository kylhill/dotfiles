- clean: ['~']

- link:
    ~/.bashrc:
        create: true
        force: true
        path: bash/bashrc
    ~/.byobu:
        create: true
        force: true
        path: byobu/
    ~/.dircolors:
        create: true
        force: true
        path: bash/dircolors/
    ~/.flexget/config.yml:
        create: true
        force: true
        path: flexget/config.yml
    ~/.gitconfig:
        create: true
        force: true
        path: git/gitconfig
    ~/.vim:
        create: true
        force: true
        path: vim/vim/
    ~/.vimrc:
        create: true
        force: true
        path: vim/vimrc
    ~/.tvnamer.json:
        create: true
        force: true

- shell:
  - [git submodule update --init --recursive, Installing submodules]
